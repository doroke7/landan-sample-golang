name: camera-shot

services:
  screenshot:
    provider:
      type: ${PROVIDER:-./bin/desktop}  # 預設 bin/desktop;make up 會依 OS/架構換成 bin/desktop-<os>-<arch>
      options:
        device: default      # 也可以填編號(0、1…)或名稱的一部分,用 system_profiler SPCameraDataType 查名稱
        output: ./runtime/desktop/shot-{time}.jpg
